[project]
name = "ogamex"
version = "1.0.0"
description = "OGameX High-Performance Async Backend Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "asyncmy>=0.2.9",
    "aiomysql>=0.2.0",
    "alembic>=1.13.2",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "redis>=5.0.8",
    "httpx>=0.27.0",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["python"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
