services:
  # 1. FastAPI Async Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ogamex-fastapi-backend
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=ogamex
      - DB_PASSWORD=ogamex_secret
      - DB_NAME=ogamex
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ECONOMY_SPEED=1
      - FLEET_SPEED=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ogamex-net

  # 2. Modern Frontend & Reverse Proxy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ogamex-frontend-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - ogamex-net

  # 3. MySQL Database
  db:
    image: mysql:8.0
    container_name: ogamex-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: ogamex
      MYSQL_USER: ogamex
      MYSQL_PASSWORD: ogamex_secret
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ogamex-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 4. Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: ogamex-redis
    restart: unless-stopped
    networks:
      - ogamex-net

networks:
  ogamex-net:
    driver: bridge

volumes:
  db_data:
