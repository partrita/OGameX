name: Laravel Pint PSR-12 Code Style Checker

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'resources/css/**'
      - 'resources/js/**'
      - 'public/css/**'
      - 'public/js/**'
      - 'public/build/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'resources/css/**'
      - 'resources/js/**'
      - 'public/css/**'
      - 'public/js/**'
      - 'public/build/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel-pint-psr12-code-style-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check if PHP project exists
        id: check-php
        run: |
          if [ ! -f "composer.json" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No composer.json - Python project, skip PHP check"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - uses: shivammathur/setup-php@v2
        if: steps.check-php.outputs.skip == 'false'
        with:
          php-version: '8.5'
          coverage: none

      - name: Get composer cache directory
        if: steps.check-php.outputs.skip == 'false'
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        if: steps.check-php.outputs.skip == 'false'
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        if: steps.check-php.outputs.skip == 'false'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Laravel Pint (PSR-12)
        if: steps.check-php.outputs.skip == 'false'
        run: composer run cs -- --verbose --test

      - name: Skip - No PHP project
        if: steps.check-php.outputs.skip == 'true'
        run: echo "Skipped Pint - Python project has no PHP code"