name: 'Docker Compose Setup'
description: 'Sets up Docker Compose environment for OGameX testing'

runs:
  using: 'composite'
  steps:
    - name: Set up Docker Compose
      shell: bash
      run: |
        # Handle both legacy PHP and new Python projects
        if [ -f "docker-compose.yml" ]; then
          # Disable USER www if present (PHP legacy)
          if grep -q "USER www" ./Dockerfile 2>/dev/null; then
            sed -i '/USER www/s/^/#/' ./Dockerfile || true
          fi
          if [ -d "/var/www" ]; then
            sudo chmod -R 777 /var/www 2>/dev/null || true
          fi
        fi
        docker compose -f docker-compose.yml up -d --build

    - name: Wait for application to be ready (max 60 seconds)
      shell: bash
      run: |
        echo "Waiting for application to be ready..."
        # Python FastAPI path
        if docker compose ps | grep -q "backend\|ogamex-fastapi"; then
          timeout 60 bash -c 'until docker compose exec -T backend curl -sf http://localhost:8000/health > /dev/null 2>&1 || docker compose exec -T ogamex-fastapi-backend curl -sf http://localhost:8000/health > /dev/null 2>&1; do echo "Waiting for backend..." && sleep 2; done' || true
          # Also check via host if curl inside fails
          timeout 30 bash -c 'until curl -sf http://localhost:8080/health > /dev/null 2>&1 || curl -sf http://localhost:8000/health > /dev/null 2>&1; do sleep 2; done' || true
        fi
        # Legacy PHP path
        if docker compose ps | grep -q "ogamex-app"; then
          timeout 60 bash -c 'until docker compose exec -T ogamex-app php artisan migrate:status > /dev/null 2>&1; do echo "Waiting for PHP app..." && sleep 2; done' || true
        fi
        # Ensure storage perms for PHP if needed
        if docker compose exec -T ogamex-app chmod -R 775 storage/ 2>/dev/null; then
          docker compose exec -T ogamex-app chown -R www-data:www-data storage/ 2>/dev/null || true
        fi
        echo "Application ready check done."
